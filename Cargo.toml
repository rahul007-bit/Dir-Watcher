[package]
name = "watch-folder"
version = "0.4.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
notify = "6.1.1"
env_logger = "0.10.0"
log = "0.4.17"
home = "0.5.5"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
eframe = "0.31"
auto-launch = "0.6"
opener = "0.7"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }
# Only for the GDI+ flat API used by the native per-pixel-alpha pet overlay.
# (Already present transitively via eframe/wgpu, so this is cheap.)
windows = { version = "0.58", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_GdiPlus",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# StatusNotifierItem (D-Bus) backend avoids the GTK/libappindicator build deps.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
# Used to force the X11/XWayland backend on Linux: GNOME Wayland forbids
# clients from positioning or raising their own windows, which the desktop
# pet needs. Same version as eframe's winit, so the types unify.
winit = { version = "0.30", default-features = false, features = ["x11"] }
# dlopen probe for libxkbcommon-x11, which winit's X11 backend needs and which
# a Wayland-only system may lack; without it we must stay on Wayland.
libc = "0.2"
# Global pointer/button polling for dragging the pet and clicking papers on X11
# (pure Rust; already in the tree via winit's X11 backend). XInput2 raw events
# are needed because ordinary pointer queries do not see clicks that land on a
# Wayland surface (which is exactly what a click-through overlay does).
    # "xtest" is used by examples/x11_drag_probe.rs (synthetic pointer
    # injection for testing the drag path without touching the mouse).
    # "shape" lets the pet viewport restrict its clickable area to the sprite
    # (x11_set_input_regions in taskbar.rs), which is what makes dragging the
    # pet work on GNOME/XWayland.
    x11rb = { version = "0.13", features = ["xinput", "shape", "xtest"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(unix)'.dependencies]
daemonize-me = "2.0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
