[package]
name = "watch-folder"
version = "0.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
notify = "6.1.1"
env_logger = "0.10.0"
log = "0.4.17"
home = "0.5.5"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
eframe = "0.31"
auto-launch = "0.6"
opener = "0.7"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }
# Only for the GDI+ flat API used by the native per-pixel-alpha pet overlay.
# (Already present transitively via eframe/wgpu, so this is cheap.)
windows = { version = "0.58", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_GdiPlus",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# StatusNotifierItem (D-Bus) backend avoids the GTK/libappindicator build deps.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(unix)'.dependencies]
daemonize-me = "2.0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
